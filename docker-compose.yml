services:
  postgres:
    image: postgres:16
    container_name: travel-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: travel_planner
    ports:
      - "5433:5432"
    volumes:
      - travel_planner_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_planner_db_data:
